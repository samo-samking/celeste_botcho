<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- ombre du pli : donne l'effet de tissu qui flotte -->
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset=".35" stop-color="#000" stop-opacity=".18"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".85" stop-color="#000" stop-opacity=".15"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cloth">
      <path d="M14 12c10-4 18 4 28 0s14-3 18-1v30c-4-2-8-3-18 1s-18-4-28 0Z"/>
    </clipPath>
  </defs>
  <!-- hampe et pommeau doré -->
  <rect x="10" y="9" width="4" height="51" rx="2" fill="#c98a00"/>
  <circle cx="12" cy="8" r="3.5" fill="#ffd95a"/>
  <!-- drapeau ondulé : orange, blanc, vert -->
  <g clip-path="url(#cloth)">
    <rect x="14" y="0" width="16" height="64" fill="#f77f00"/>
    <rect x="30" y="0" width="15" height="64" fill="#ffffff"/>
    <rect x="45" y="0" width="16" height="64" fill="#009e60"/>
    <rect x="14" y="0" width="47" height="64" fill="url(#fold)"/>
  </g>
  <path d="M14 12c10-4 18 4 28 0s14-3 18-1v30c-4-2-8-3-18 1s-18-4-28 0Z" fill="none" stroke="#000" stroke-opacity=".15"/>
</svg>
