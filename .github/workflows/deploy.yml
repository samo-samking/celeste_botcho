# CI / CD — Céleste Bôtchô (§0.5 du programme)
#
# - Chaque push et pull request : lint → types → tests → règles Firestore → build → pré-rendu.
# - Pull request : prévisualisation Hosting (canal de 7 jours), si FIREBASE_SERVICE_ACCOUNT est configuré.
# - Production : déclenchement MANUEL uniquement (onglet Actions › « CI / Déploiement » › Run workflow,
#   case « deploy » cochée). Pour passer au déploiement automatique sur main plus tard,
#   remplacer la condition du job `deploy` par : github.event_name == 'push' && github.ref == 'refs/heads/main'
#
# Configuration GitHub (Settings › Secrets and variables › Actions) :
# - Secret   FIREBASE_SERVICE_ACCOUNT : JSON du compte de service (prévisualisation + déploiement)
# - Variables VITE_* (voir .env.example) et, pour les Functions : SMTP_HOST, SMTP_PORT, MAIL_FROM_NAME,
#   MAIL_TO_OWNER, CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY

name: CI / Déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Déployer en production (hosting public + admin, règles, functions)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
  VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
  VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
  VITE_CLOUDINARY_CLOUD_NAME: ${{ vars.VITE_CLOUDINARY_CLOUD_NAME }}
  VITE_CLOUDINARY_UPLOAD_PRESET: ${{ vars.VITE_CLOUDINARY_UPLOAD_PRESET }}
  VITE_USE_EMULATORS: 'false'

jobs:
  checks:
    name: Vérifications et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4 # émulateur Firestore
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm i -g firebase-tools
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rules
      - run: npm run build
      - run: npm run prerender
      - name: Build des Cloud Functions
        working-directory: functions
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            apps/public/dist
            apps/admin/dist
          retention-days: 3

  preview:
    name: Prévisualisation (pull request)
    needs: checks
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: apps
      - name: Prévisualisation du site public
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: celestebotcho-322a5
          target: public
          expires: 7d
      - name: Prévisualisation de l'admin
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: celestebotcho-322a5
          target: admin
          expires: 7d
      - name: Compte de service absent
        if: env.HAS_SERVICE_ACCOUNT != 'true'
        run: echo "::notice::FIREBASE_SERVICE_ACCOUNT non configuré, prévisualisation ignorée."

  deploy:
    name: Déploiement production
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: apps
      - run: npm i -g firebase-tools
      - name: Dépendances des Functions (le predeploy de firebase.json lance leur build)
        run: npm ci --prefix functions
      - name: Paramètres des Functions (functions/.env, non sensibles)
        run: |
          cat > functions/.env <<EOF
          SMTP_HOST=${{ vars.SMTP_HOST }}
          SMTP_PORT=${{ vars.SMTP_PORT }}
          MAIL_FROM_NAME=${{ vars.MAIL_FROM_NAME }}
          MAIL_TO_OWNER=${{ vars.MAIL_TO_OWNER }}
          CLOUDINARY_CLOUD_NAME=${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ vars.CLOUDINARY_API_KEY }}
          EOF
      - name: Identifiants Google Cloud
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Déploiement
        run: firebase deploy --only hosting:public,hosting:admin,firestore,functions --project celestebotcho-322a5 --non-interactive --force
